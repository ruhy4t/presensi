name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo
      - name: PHP syntax
        run: find config public scripts src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Regression checks
        run: php tests/run.php
